<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- PWA: instalável na tela inicial (ver public/manifest.webmanifest e public/sw.js) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS ignora o manifest para tela cheia e push: precisa destas meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ERPOS" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Páginas do motoboy instalam o app "ERPOS Entregas" (abre em /app-entregas), não o ERPOS geral.
      (function () {
        var p = location.pathname;
        if (!/^\/(motoboy\/|entregas\/|app-entregas)/.test(p)) return;
        document.querySelector('link[rel="manifest"]').setAttribute('href', '/manifest-entregas.webmanifest');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#18181b');
        document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', 'Entregas');
      })();
      // App do clube: cada loja instala o SEU app (nome, ícone e cor da loja) — o manifest
      // vem do clube-app por um rewrite do vercel.json (mesma origem). Em dev, direto da Edge.
      (function () {
        var m = location.pathname.match(/^\/clube\/([^\/?#]+)/);
        if (!m) return;
        var slug = encodeURIComponent(decodeURIComponent(m[1]));
        var local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
        var link = document.querySelector('link[rel="manifest"]');
        link.setAttribute('href', local ? '%VITE_PUBLIC_SUPABASE_URL%/functions/v1/clube-app?manifest=' + slug : '/clube-app/manifest/' + slug);
        // Preview protegido da Vercel: o manifest precisa ir com o cookie de acesso.
        link.setAttribute('crossorigin', 'use-credentials');
        var icone = document.querySelector('link[rel="apple-touch-icon"]');
        if (icone) icone.parentNode.removeChild(icone);
        document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', 'Clube');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <title>ERPOS V2 — Sistema PDV</title>
    <!-- Meta Pixel Code (fora do app do clube: lá não carrega script de terceiros) -->
    <script>
      if (/^\/clube\//.test(location.pathname)) { window.fbq = function () {}; } else {
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      // Dois datasets: o site alimenta AMBOS (fbq('track') faz broadcast p/ todos
      // os pixels inicializados). '...0561' = conta antiga (campanha ativa);
      // '...6871' = El Patron API (conta nova). Cada conta otimiza a sua campanha.
      fbq('init', '1021977890320561');
      fbq('init', '1517617819416871');
      fbq('track', 'PageView');
      }
    </script>
    <!-- End Meta Pixel Code -->
  </head>
  <body>
    <!-- Meta Pixel: fallback sem JavaScript (noscript não é permitido no head) -->
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1021977890320561&ev=PageView&noscript=1"
    /></noscript>
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1517617819416871&ev=PageView&noscript=1"
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Rede de segurança (2026-10-05): se a tela abriu SEM o CSS (cópia velha do app guardada no
      // aparelho apontando para um arquivo de estilo que já não existe), limpa a cópia do app e
      // recarrega UMA vez. Sonda: a classe 'hidden' do Tailwind tem que esconder o elemento.
      (function () {
        function cssOk() {
          var d = document.createElement('div');
          d.className = 'hidden';
          document.body.appendChild(d);
          var ok = getComputedStyle(d).display === 'none';
          d.parentNode.removeChild(d);
          return ok;
        }
        window.addEventListener('load', function () {
          setTimeout(function () {
            if (cssOk()) return;
            try {
              var k = 'erpos-css-recarga', t = Number(sessionStorage.getItem(k) || 0);
              if (Date.now() - t < 60000) return;
              sessionStorage.setItem(k, String(Date.now()));
            } catch (e) {}
            var vai = function () { location.reload(); };
            if (window.caches && caches.keys) {
              caches.keys().then(function (nomes) {
                return Promise.all(nomes.filter(function (n) { return n.indexOf('erpos-shell') === 0; }).map(function (n) { return caches.delete(n); }));
              }).then(vai, vai);
            } else vai();
          }, 2500);
        });
      })();
    </script>
  </body>
</html>
